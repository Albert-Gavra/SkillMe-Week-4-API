
name: Combined UI and API Tests

# Run both test suites whenever code is pushed
# or a pull request is created in this repository.
on:
  push:
  pull_request:

jobs:

  # Job 1: Run Playwright UI automation tests.
  ui-tests:
    name: Run UI Automation Tests
    runs-on: ubuntu-latest

    steps:
      # Download the UI testing repository.
      - name: Checkout UI repository
        uses: actions/checkout@v4
        with:
          repository: Albert-Gavra/SwagLabs-Manual-Testing
          ref: main
          path: ui-project

      # Set up Python environment.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install UI project dependencies.
      - name: Install UI dependencies
        working-directory: ui-project/SkillMe-Week-3
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Install Chromium and its required system dependencies.
      - name: Install Playwright Chromium
        working-directory: ui-project/SkillMe-Week-3
        run: python -m playwright install --with-deps chromium

      # Run the Playwright UI test suite.
      - name: Run UI tests
        working-directory: ui-project/SkillMe-Week-3
        run: python -m pytest

  # Job 2: Run API automation tests.
  api-tests:
    name: Run API Test Suite
    runs-on: ubuntu-latest

    steps:
      # Download the API testing repository.
      - name: Checkout API repository
        uses: actions/checkout@v4

      # Set up Python environment.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install API project dependencies.
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Create the reports directory.
      - name: Create reports directory
        run: mkdir -p reports

      # Run API tests and generate an HTML report.
      - name: Run API tests
        run: |
          python -m pytest --html=reports/api-test-report.html --self-contained-html

      # Upload the API test report.
      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: reports/api-test-report.html
          if-no-files-found: ignore
