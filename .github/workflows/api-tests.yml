
name: API Tests

# Run the workflow whenever code is pushed
# or a pull request is created.
on:
  push:
  pull_request:

jobs:
  api-tests:
    name: Run API Test Suite
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install project dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Step 4: Create the reports directory.
      - name: Create reports directory
        run: mkdir -p reports

      # Step 5: Run the API test suite and generate HTML report.
      - name: Run API tests
        run: |
          python -m pytest --html=reports/api-test-report.html --self-contained-html

      # Step 6: Upload the HTML report as a workflow artifact.
      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: reports/api-test-report.html
          if-no-files-found: ignore
